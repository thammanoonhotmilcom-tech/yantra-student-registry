<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดรายชื่อลูกศิษสำนักอาจารย์คม</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;600;700;800&display=swap');
:root{--gold:#d8ad45;--gold2:#f1d37c;--bg:#070605;--panel:#120e08;--line:#493817;--text:#f5e9cd;--muted:#b4a47d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,rgba(216,173,69,.14),transparent 35%),#070605;color:var(--text);font-family:'Noto Serif Thai',serif}
.app{display:grid;grid-template-columns:285px 1fr;min-height:100vh}.side{padding:22px 16px;border-right:1px solid var(--line);background:rgba(10,8,5,.96)}
.brand{text-align:center}.brand img{width:170px;height:170px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 18px rgba(216,173,69,.22))}
.brand h1{font-size:18px;color:var(--gold2);line-height:1.5;margin:10px 0 20px}.nav button,.owner button{display:block;width:100%;margin:5px 0;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:#d5c18b;text-align:left;font:inherit;cursor:pointer}.nav button:hover,.nav button.active{border-color:#69501d;background:#1a140a;color:var(--gold2)}
.owner{border-top:1px solid var(--line);margin-top:18px;padding-top:15px}.owner button{border-color:#69501d;background:#171107;text-align:center}
.main{width:min(1180px,100%);margin:auto;padding:34px}.ey{color:var(--muted);font-size:14px}.title{font-size:clamp(27px,4vw,46px);font-weight:800;color:var(--gold2);line-height:1.2;margin:7px 0}.desc{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.stat,.card{background:linear-gradient(145deg,#171108,#0d0a06);border:1px solid var(--line);border-radius:15px}.stat{padding:15px}.stat .v{font-size:31px;font-weight:800;color:var(--gold2)}.stat .k{color:var(--muted);font-size:13px}
.tools{display:flex;gap:10px;margin:15px 0}.tools input,.tools select,.modal input{flex:1;padding:12px;border:1px solid #5b451b;border-radius:10px;background:#0b0906;color:var(--text);font:inherit}
.card{overflow:hidden;margin-bottom:4px}.head{display:flex;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}.head h2{margin:0;color:var(--gold2);font-size:20px}.head span{color:var(--muted)}
.row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid #2c2414}.num{color:var(--gold)}.acts button,.add,.topbtn{padding:8px 11px;border:1px solid #69501d;border-radius:8px;background:#171107;color:#ead79e;font:inherit;cursor:pointer}.del{color:#e6a39b!important}
.add{margin:11px 0 20px}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:16px;z-index:20}.modalbg.show{display:flex}.modal{width:min(480px,95vw);padding:20px;border:1px solid var(--gold);border-radius:16px;background:#151008;box-shadow:0 20px 80px #000}.modal h3{color:var(--gold2);margin-top:0}.modal input{width:100%}.buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.toast{position:fixed;right:18px;bottom:18px;display:none;background:#1b150b;border:1px solid #69501d;padding:12px 15px;border-radius:10px;z-index:30}.toast.show{display:block}
@media(max-width:850px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{padding:18px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.nav{grid-template-columns:1fr}.stats{gap:8px}.stat .v{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
<div class="brand"><img src="/assets/logo.png" alt="ตราสำนักอาจารย์คม"><h1>สมุดรายชื่อลูกศิษสำนักอาจารย์คม</h1></div>
<div class="nav" id="nav"></div>
<div class="owner"><button onclick="toggleOwner()">✎ แก้ไขข้อมูล (สำหรับเจ้าของ)</button></div>
</aside>
<main class="main">
<div class="ey">ทะเบียนลูกศิษย์</div>
<div class="title">สมุดรายชื่อลูกศิษสำนักอาจารย์คม</div>
<div class="desc">เปิดดูรายชื่อได้ทั่วไป · การเพิ่ม แก้ไข และลบรายชื่อสงวนสิทธิ์เจ้าของสำนัก</div>
<div class="stats" id="stats"></div>
<div class="tools"><input id="q" placeholder="ค้นหารายชื่อ..." oninput="render()"><select id="filter" onchange="render()"></select></div>
<div id="content"></div>
</main>
</div>

<div class="modalbg" id="modal"><div class="modal"><h3 id="modalTitle"></h3><input id="modalName" placeholder="ชื่อ-นามสกุล"><div class="buttons"><button class="topbtn" onclick="closeModal()">ยกเลิก</button><button class="topbtn" onclick="saveName()">บันทึก</button></div></div></div>
<div class="modalbg" id="keyModal"><div class="modal"><h3>เปิดโหมดเจ้าของ</h3><input id="adminKey" type="password" placeholder="รหัสเจ้าของ"><div class="buttons"><button class="topbtn" onclick="closeKey()">ยกเลิก</button><button class="topbtn" onclick="unlock()">เปิดโหมด</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const GROUPS={teacher:"อาจารย์",master:"ศิษย์เอก",student:"ศิษย์ใน",r1:"รุ่นที่ 1 · มหาฤกษ์",r2:"รุ่นที่ 2 · เทวาสถิต",r3:"รุ่นที่ 3 · นะจังงัง",r4:"รุ่นที่ 4 · แคล้วพ้นเคราะห์",r5:"รุ่นที่ 5 · สุเวทท้าวสุวรรณ์"};
let state={data:{},admin:false,section:"all",editing:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));

function toast(t){$("#toast").textContent=t;$("#toast").classList.add("show");setTimeout(()=>$("#toast").classList.remove("show"),2200)}
function total(){return Object.values(state.data).reduce((n,a)=>n+(a?.length||0),0)}
async function load(){const r=await fetch("/api/data");const j=await r.json();if(!r.ok)return toast(j.error||"โหลดข้อมูลไม่ได้");state.data=j.data;state.admin=j.admin;render()}
function selectSection(k){state.section=k;render()}
function render(){
  $("#nav").innerHTML=`<button class="${state.section==="all"?"active":""}" onclick="selectSection('all')">⌂ ภาพรวม</button>`+
    Object.entries(GROUPS).map(([k,v])=>`<button class="${state.section===k?"active":""}" onclick="selectSection('${k}')">${v}</button>`).join("");
  const inSchool=["r1","r2","r3","r4","r5"].reduce((n,k)=>n+(state.data[k]?.length||0),0);
  $("#stats").innerHTML=[["อาจารย์",state.data.teacher?.length||0],["ศิษย์เอก",state.data.master?.length||0],["ศิษย์ใน",inSchool],["รวมทั้งหมด",total()]].map(x=>`<div class="stat"><div class="k">${x[0]}</div><div class="v">${x[1]}</div></div>`).join("");
  const filter=$("#filter"); if(!filter.options.length) filter.innerHTML=`<option value="all">ทุกหมวด</option>`+Object.entries(GROUPS).map(([k,v])=>`<option value="${k}">${v}</option>`).join("");
  const q=$("#q").value.toLowerCase(), f=filter.value;
  const keys=state.section==="all"?Object.keys(GROUPS):[state.section];
  $("#content").innerHTML=keys.filter(k=>f==="all"||f===k).map(k=>{
    const rows=(state.data[k]||[]).filter(x=>x.name.toLowerCase().includes(q));
    return `<section class="card"><div class="head"><h2>${GROUPS[k]}</h2><span>${rows.length} รายชื่อ</span></div>`+
      (rows.map((x,i)=>`<div class="row"><div class="num">${i+1}</div><div>${esc(x.name)}</div><div class="acts">${state.admin?`<button onclick="editName('${k}','${x.id}')">แก้ไข</button> <button class="del" onclick="removeName('${k}','${x.id}')">ลบ</button>`:""}</div></div>`).join("")||`<div class="row">ยังไม่มีรายชื่อ</div>`)+
      `</section>`+(state.admin?`<button class="add" onclick="addName('${k}')">＋ เพิ่มรายชื่อในหมวดนี้</button>`:"");
  }).join("");
}
function addName(group){state.editing={group};$("#modalTitle").textContent=`เพิ่มรายชื่อ · ${GROUPS[group]}`;$("#modalName").value="";$("#modal").classList.add("show");setTimeout(()=>$("#modalName").focus(),50)}
function editName(group,id){const item=state.data[group].find(x=>x.id===id);state.editing={group,id};$("#modalTitle").textContent="แก้ไขรายชื่อ";$("#modalName").value=item?.name||"";$("#modal").classList.add("show");setTimeout(()=>$("#modalName").focus(),50)}
function closeModal(){$("#modal").classList.remove("show")}
async function saveName(){
  const name=$("#modalName").value.trim(); if(!name)return toast("กรุณากรอกชื่อ");
  const x=state.editing, isEdit=!!x.id;
  const r=await fetch(isEdit?`/api/data/${x.group}/${x.id}`:"/api/data",{method:isEdit?"PATCH":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(isEdit?{name}:{group:x.group,name})});
  const j=await r.json(); if(!r.ok)return toast(j.error||"บันทึกไม่ได้");
  state.data=j.data;closeModal();render();toast("บันทึกเรียบร้อย");
}
async function removeName(group,id){
  if(!confirm("ต้องการลบรายชื่อนี้ใช่หรือไม่?"))return;
  const r=await fetch(`/api/data/${group}/${id}`,{method:"DELETE"}),j=await r.json();
  if(!r.ok)return toast(j.error||"ลบไม่ได้"); state.data=j.data;render();toast("ลบเรียบร้อย");
}
function toggleOwner(){if(state.admin){fetch("/api/admin/lock",{method:"POST"}).then(load);return}$("#keyModal").classList.add("show");setTimeout(()=>$("#adminKey").focus(),50)}
function closeKey(){$("#keyModal").classList.remove("show")}
async function unlock(){
  const key=$("#adminKey").value;
  const r=await fetch("/api/admin/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
  const j=await r.json(); if(!r.ok)return toast(j.error||"รหัสไม่ถูกต้อง");
  closeKey();$("#adminKey").value="";await load();toast("เปิดโหมดเจ้าของแล้ว");
}
load();
</script>
</body>
</html>
